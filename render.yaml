services:
  # FastAPI Backend
  - type: web
    name: ai-code-review-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /health
    
  # Streamlit Frontend
  - type: web
    name: ai-code-review-frontend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port 10001 --server.address 0.0.0.0
    envVars:
      - key: API_URL
        value: https://ai-code-review-backend.onrender.com
      - key: GROQ_API_KEY
        sync: false